<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pawGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8B67;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B47;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main paw pad -->
  <ellipse cx="32" cy="42" rx="14" ry="16" fill="url(#pawGradient)"/>

  <!-- Top left toe -->
  <ellipse cx="18" cy="22" rx="6" ry="8" fill="url(#pawGradient)"/>

  <!-- Top middle toe -->
  <ellipse cx="32" cy="18" rx="6" ry="8" fill="url(#pawGradient)"/>

  <!-- Top right toe -->
  <ellipse cx="46" cy="22" rx="6" ry="8" fill="url(#pawGradient)"/>

  <!-- Bottom toe -->
  <ellipse cx="32" cy="30" rx="5" ry="6" fill="url(#pawGradient)"/>
</svg>
